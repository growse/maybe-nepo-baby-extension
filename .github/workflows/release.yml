name: Release

# Tagging v1.2.3 builds the package and attaches it to a GitHub release.
# The same zip uploads to both the Chrome Web Store and addons.mozilla.org --
# neither wants a .crx, and Chrome refuses self-hosted extensions on Windows
# and macOS anyway.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: extractions/setup-just@v4

      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      # Both stores reject a re-upload of a version that already exists, and
      # the failure arrives after the build. Catch the mismatch up front.
      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - name: Lint with the AMO validator
        run: just lint

      - name: Build package
        run: just package

      - name: Attach the package to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      # Runs after the release so a rejected upload still leaves the tag's zip
      # downloadable from GitHub. AMO takes the JWT issuer as the key and the
      # JWT secret separately; web-ext reads both from the environment.
      - name: Publish to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.MOZILLA_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.MOZILLA_API_SECRET }}
        run: just publish-firefox

      # The two stores are independent, so a rejection from one should not stop
      # the other being submitted -- but a cancelled run still stops here.
      - name: Publish to the Chrome Web Store
        if: ${{ !cancelled() }}
        env:
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: just publish-chrome
