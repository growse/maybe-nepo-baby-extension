name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: extractions/setup-just@v3

      # `just package` regenerates the icons, so the runner needs rsvg-convert.
      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Check JavaScript syntax
        run: node --check content.js

      - name: Validate manifest references
        run: just check

      - name: Lint with the AMO validator
        run: just lint

      - name: Build package
        run: just package

      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: nepo-maybe-baby
          path: dist/*.zip
          if-no-files-found: error
